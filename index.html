<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Menú digital de Restaurante Pueblito Viejo Sandoná - Sabor y Tradición" />
    <title>Pueblito Viejo Sandoná | Menú</title>
    <style>
      /* Fallback estatico mientras carga el bundle de React, para no mostrar pantalla en blanco. */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #3d1a12;
        color: #fdf8ee;
        font-family: system-ui, sans-serif;
        z-index: 9999;
      }
      #initial-loader .spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid rgba(253, 248, 238, 0.25);
        border-top-color: #e2338c;
        animation: initial-loader-spin 0.8s linear infinite;
      }
      @keyframes initial-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <p>Tu menú está cargando...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
